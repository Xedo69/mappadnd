<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mappa Tattica D&amp;D · Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css?v=theme-6">
</head>
<body class="player-page">
    <iframe id="player-map" title="Mappa giocatore"></iframe>
    <script>
        const entry = new URLSearchParams(window.location.search).get('entry') || 'account';
        const params = new URLSearchParams(window.location.search);
        params.set('mode', 'player');
        params.set('role', 'player');
        params.set('entry', entry);
        if (!params.has('v')) params.set('v', 'sessions-1');
        document.getElementById('player-map').src = `./master.html?${params.toString()}`;
    </script>
</body>
</html>
