<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Accedi · Mappa Tattica D&D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: Inter, sans-serif;
            color: #e2e8f0;
            background-color: #020617;
            background-image:
                linear-gradient(180deg, rgba(2, 6, 23, .58), rgba(2, 6, 23, .78)),
                radial-gradient(ellipse at 50% -15%, rgba(79, 70, 229, .22), transparent 58%),
                url("https://media.istockphoto.com/id/1498453935/it/vettoriale/modello-marrone-senza-cuciture-di-dadi-d4-d6-d8-d10-d12-e-d20-per-giochi-da-tavolo.jpg?s=612x612&w=0&k=20&c=biA7bkrpklUH7ETql4KK5WFTy0ZltisCflrrnBlbQfc=");
            background-position: center, center, top left;
            background-size: cover, cover, 420px 420px;
            background-repeat: no-repeat, no-repeat, repeat;
        }
        input { font-size: 16px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body class="flex min-h-screen min-h-[100dvh] items-center justify-center p-4">
    <main class="w-full max-w-md">
        <div class="mb-6 text-center">
            <div class="mx-auto mb-4 flex h-[88px] w-[63px] items-center justify-center overflow-hidden rounded-xl border border-indigo-400/30 bg-slate-950/70 shadow-lg shadow-indigo-950/40">
                <img src="https://i.pinimg.com/736x/06/ec/5f/06ec5f49037127d3b4acca6acf996374.jpg" alt="Illustrazione fantasy per il login della mappa tattica" class="h-full w-full object-cover">
            </div>
            <p class="mb-2 text-xs font-semibold uppercase tracking-[.22em] text-indigo-300">Mappa Tattica</p>
            <h1 class="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">Accedi al tuo cloud</h1>
            <p class="mx-auto mt-3 max-w-sm text-sm leading-6 text-slate-400">Inserisci le credenziali per caricare la mappa e i dati salvati nel tuo account.</p>
        </div>

        <section class="rounded-2xl border border-slate-700/80 bg-slate-900/90 p-5 shadow-2xl shadow-black/30 backdrop-blur sm:p-7">
            <form id="login-form" class="space-y-4">
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium text-slate-300">Email</span>
                    <input id="login-email" type="email" autocomplete="username" required placeholder="nome@esempio.it" class="h-12 w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 text-white outline-none transition placeholder:text-slate-600 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/15">
                </label>
                <label class="block">
                    <span class="mb-1.5 block text-sm font-medium text-slate-300">Password</span>
                    <input id="login-password" type="password" autocomplete="current-password" required placeholder="La tua password" class="h-12 w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 text-white outline-none transition placeholder:text-slate-600 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/15">
                </label>
                <p id="login-status" class="hidden rounded-xl border px-3 py-2.5 text-sm leading-5" role="status" aria-live="polite"></p>
                <button id="login-submit" type="submit" class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-4 font-semibold text-white shadow-lg shadow-indigo-950/40 transition hover:bg-indigo-500 active:scale-[.99] disabled:cursor-wait disabled:opacity-60">
                    <span>Accedi e carica la mappa</span>
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-6-6 6 6-6 6"/></svg>
                </button>
                <button id="signup-submit" type="button" class="h-11 w-full rounded-xl border border-slate-700 bg-slate-800/70 px-4 text-sm font-medium text-slate-200 transition hover:border-slate-600 hover:bg-slate-800 disabled:cursor-wait disabled:opacity-60">Crea un nuovo account</button>
                <div class="flex items-center gap-3 py-1 text-[11px] font-medium uppercase tracking-widest text-slate-600"><span class="h-px flex-1 bg-slate-800"></span><span>oppure</span><span class="h-px flex-1 bg-slate-800"></span></div>
                <button id="demo-submit" type="button" class="h-12 w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 text-sm font-semibold text-slate-300 transition hover:border-indigo-400/50 hover:bg-slate-800 hover:text-white active:scale-[.99] disabled:cursor-wait disabled:opacity-60">Entra in demo senza account</button>
                <p class="text-center text-xs leading-5 text-slate-500">La demo apre una mappa vuota e non sincronizza dati con il cloud.</p>
            </form>
            <div class="mt-5 flex items-center justify-center gap-2 text-xs text-slate-500">
                <span id="connection-dot" class="h-2 w-2 rounded-full bg-rose-400"></span>
                <span id="connection-label">Cloud offline</span>
            </div>
        </section>
        <p class="mt-5 text-center text-xs text-slate-600">I tuoi dati vengono caricati dall’account Supabase collegato.</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=mapfit1"></script>
    <script>
        const LOGIN_GATE_KEY = 'dnd-cloud-login-approved';
        const cloudConfig = window.MAP_CLOUD_CONFIG || {};
        const cloudEnabled = Boolean(cloudConfig.url && cloudConfig.anonKey && !cloudConfig.url.includes('INSERISCI') && !cloudConfig.anonKey.includes('INSERISCI') && window.supabase?.createClient);
        const cloudClient = cloudEnabled ? window.supabase.createClient(cloudConfig.url, cloudConfig.anonKey, {
            auth: { persistSession: true, detectSessionInUrl: true }
        }) : null;
        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const loginButton = document.getElementById('login-submit');
        const signupButton = document.getElementById('signup-submit');
        const demoButton = document.getElementById('demo-submit');
        const statusBox = document.getElementById('login-status');
        const confirmationLink = window.location.hash.includes('access_token=');

        function showStatus(message, kind = 'error') {
            statusBox.textContent = message;
            statusBox.className = `rounded-xl border px-3 py-2.5 text-sm leading-5 ${kind === 'error' ? 'border-rose-900/80 bg-rose-950/50 text-rose-200' : 'border-emerald-900/80 bg-emerald-950/50 text-emerald-200'}`;
        }

        function setBusy(busy) {
            loginButton.disabled = busy;
            signupButton.disabled = busy;
            demoButton.disabled = busy;
        }

        function enterMap(mode = 'account') {
            sessionStorage.setItem(LOGIN_GATE_KEY, mode);
            window.location.replace('./index.html');
        }

        demoButton.addEventListener('click', async () => {
            setBusy(true);
            if (cloudClient) await cloudClient.auth.signOut({ scope: 'local' }).catch(() => {});
            enterMap('demo');
        });

        if (!cloudEnabled) {
            showStatus('La connessione cloud non è configurata. Contatta chi gestisce il sito.', 'error');
            loginButton.disabled = true;
            signupButton.disabled = true;
            document.getElementById('connection-label').textContent = 'Cloud non configurato';
        } else {
            document.getElementById('connection-dot').className = 'h-2 w-2 rounded-full bg-emerald-400';
            document.getElementById('connection-label').textContent = 'Cloud pronto';

            cloudClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session && confirmationLink) enterMap();
            });

            form.addEventListener('submit', async event => {
                event.preventDefault();
                setBusy(true);
                statusBox.classList.add('hidden');
                try {
                    const { data, error } = await cloudClient.auth.signInWithPassword({
                        email: emailInput.value.trim(),
                        password: passwordInput.value
                    });
                    if (error) throw error;
                    if (!data.session) throw new Error('Accesso non completato. Riprova.');
                    enterMap();
                } catch (error) {
                    showStatus(error.message || 'Impossibile accedere. Controlla email e password.');
                    setBusy(false);
                }
            });

            signupButton.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                if (!email || !password || password.length < 8) {
                    showStatus('Inserisci un’email valida e una password di almeno 8 caratteri.');
                    return;
                }
                setBusy(true);
                statusBox.classList.add('hidden');
                try {
                    const { data, error } = await cloudClient.auth.signUp({
                        email,
                        password,
                        options: { emailRedirectTo: new URL('./login.html', window.location.href).toString() }
                    });
                    if (error) throw error;
                    if (data.session) enterMap();
                    else showStatus('Account creato. Conferma l’indirizzo email, poi torna qui per accedere.', 'success');
                } catch (error) {
                    showStatus(error.message || 'Impossibile creare l’account.');
                } finally {
                    setBusy(false);
                }
            });
        }
    </script>
</body>
</html>
